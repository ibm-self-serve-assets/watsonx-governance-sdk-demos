[project]
name = "rag-agent-demo"
version = "0.1.0"
description = "LangGraph agent with watsonx.governance demo"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4.0"
dependencies = [
    "langchain>=0.2.14",
    "langchain-community>=0.3.30",
    "langchain-tavily>=0.1",
    "langgraph>=0.2.23,<0.5.0",
    "python-dotenv>=1.0.1",
    "pymupdf>=1.26.4",
    "qdrant-client>=1.15.1",
    "langchain-qdrant>=0.2.1",
    "ibm-watsonx-gov[agentic]",
    "ibm-watsonx-ai",
    "langchain-ibm",
    "tavily"
]

[tool.setuptools.packages.find]
include = ["studio*"]
